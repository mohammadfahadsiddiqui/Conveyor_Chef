name: Export Unity Assets 04a78d6

on:
  push:
    branches:
      - export-assets-04a78d6

jobs:
  export-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v4

      - name: Create Unity Assets archive
        run: |
          zip -r Conveyor_Chef_Assets_04a78d6.zip Assets

      - name: Upload Assets ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Conveyor_Chef_Assets_04a78d6
          path: Conveyor_Chef_Assets_04a78d6.zip
          compression-level: 0
          retention-days: 7
